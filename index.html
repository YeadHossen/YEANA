<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary App Identity & SEO -->
    <title>YEANA — Bangladesh Travel, Tourism, Hotels & Transport Hub</title>
    <meta name="title" content="YEANA — Bangladesh Travel, Tourism, Hotels & Transport Hub" />
    <meta name="description" content="YEANA is Bangladesh's premier all-in-one travel and lifestyle platform. Explore all 64 districts, book hotels, discover authentic food, search inter-district transport (bus, train, flight, launch, car), and plan smart trip itineraries." />
    <meta name="keywords" content="YEANA, yeana travel, travel bangladesh, bangladesh tourism, 64 districts bangladesh, bus train flight schedule, sajek valley, coxs bazar hotel booking, sylhet travel, kuakata, yeana app, yeana website" />
    <meta name="author" content="YEANA Travel Bangladesh" />
    <meta name="robots" content="index, follow" />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#047857" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YEANA" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yeanatravel.com" />
    <meta property="og:site_name" content="YEANA" />
    <meta property="og:title" content="YEANA — Explore More. Enjoy Life | Travel Bangladesh" />
    <meta property="og:description" content="Your ultimate travel companion for Bangladesh. Explore tourist spots, hotels, food, transport schedules, and create unforgettable trip itineraries." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1596895111956-bf1cf0599ce5?w=1200&auto=format&fit=crop&q=80" />

    <!-- Twitter Preview -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="YEANA — Bangladesh Travel & Tourism Platform" />
    <meta property="twitter:description" content="Discover 64 districts, authentic local food, top hotels, train/bus/flight schedules, and itinerary planners across Bangladesh." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1596895111956-bf1cf0599ce5?w=1200&auto=format&fit=crop&q=80" />

    <!-- Schema.org JSON-LD Structured Data for Google Search Indexing -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "YEANA",
        "alternateName": ["YEANA Travel", "YEANA Bangladesh", "YEANA Tourism", "yeana.com"],
        "url": "https://yeanatravel.com",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "All",
        "description": "All-in-one travel, tourism, hotel booking, inter-district transport search, and trip planning platform for Bangladesh.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BDT"
        },
        "publisher": {
          "@type": "Organization",
          "name": "YEANA",
          "logo": {
            "@type": "ImageObject",
            "url": "https://images.unsplash.com/photo-1596895111956-bf1cf0599ce5?w=800"
          }
        }
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
